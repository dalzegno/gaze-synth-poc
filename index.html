<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Head Synth</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --fg: #1d1d1b;
        --mut: #6b6a64;
        --card: #fff;
        --line: #d9d7cf;
        --acc: #2f6fed;
        --on: #e8590c;
        --onfg: #fff;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #151514;
          --fg: #f0eee8;
          --mut: #9a988f;
          --card: #222220;
          --line: #3a3935;
          --acc: #6b9bff;
          --on: #ff8a3d;
          --onfg: #151514;
        }
      }
      :root[data-theme="dark"] {
        --bg: #151514;
        --fg: #f0eee8;
        --mut: #9a988f;
        --card: #222220;
        --line: #3a3935;
        --acc: #6b9bff;
        --on: #ff8a3d;
        --onfg: #151514;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        background: var(--bg);
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        z-index: 5;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .top {
        flex-wrap: nowrap;
        align-items: center;
      }
      button {
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        min-height: 44px;
        cursor: pointer;
      }
      button.sel {
        background: var(--acc);
        color: var(--onfg);
        border-color: var(--acc);
      }
      #scaleBtn,
      #gear {
        width: 44px;
        padding: 0;
        font-size: 20px;
        flex: none;
      }
      .wave {
        flex: 1;
        min-width: 70px;
      }
      .seg {
        flex: 1;
      }
      .panel {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 62px);
        width: min(320px, calc(100vw - 24px));
        max-height: calc(100vh - 90px);
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        z-index: 60;
        display: none;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
      }
      .panel.open {
        display: block;
      }
      #scalePanel {
        left: 12px;
      }
      #settings {
        right: 12px;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .panel label {
        display: block;
        font-size: 13px;
        color: var(--mut);
        margin: 6px 0;
      }
      .panel button {
        min-height: 40px;
        padding: 6px;
        background: var(--bg);
      }
      .panel button.sel {
        background: var(--acc);
      }
      .g3,
      .g4 {
        display: grid;
        gap: 6px;
      }
      .g3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .g4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .aRow {
        display: grid;
        grid-template-columns: 48px 1fr 48px;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      #aVal {
        text-align: center;
        font-weight: 600;
      }
      #sens {
        width: 100%;
        margin: 0 0 10px;
      }
      #status {
        font-size: 12px;
        color: var(--mut);
        padding: 2px 2px 0;
      }
      #dbg {
        font-size: 11px;
        color: var(--mut);
        padding: 2px;
      }
      main {
        padding: 12px;
      }
      #notes.grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      #notes.list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .note {
        font-size: 22px;
        font-weight: 600;
        min-height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
      }
      #notes.list .note {
        flex-direction: row;
        justify-content: space-between;
        min-height: 60px;
        padding: 0 18px;
      }
      .note small {
        font-size: 10px;
        font-weight: 400;
        opacity: 0.65;
        text-align: center;
      }
      .note.on {
        background: var(--on);
        color: var(--onfg);
        border-color: var(--on);
      }
      .gazed {
        outline: 3px solid var(--acc);
        outline-offset: 2px;
      }
      #cursor {
        position: fixed;
        left: 0;
        top: 0;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 3px solid var(--acc);
        background: rgba(47, 111, 237, 0.12);
        pointer-events: none;
        z-index: 70;
        display: none;
        transition: background 0.1s;
      }
      #cursor.active {
        background: rgba(232, 89, 12, 0.45);
        border-color: var(--on);
      }
      /* WebGazer injects a camera preview and overlays at the top-left; keep them invisible and unclickable so they never block the notes */
      [id^="webgazer"] {
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="row top">
        <button id="scaleBtn" aria-label="Scale">🎼</button
        ><button class="seg" id="track">Start tracking</button
        ><button class="seg" id="recenter">Recenter</button
        ><button id="gear" aria-label="Settings">⚙️</button>
      </div>
      <div id="status">
        Tap notes to play. For hands-free control, open ⚙️ settings and start
        tracking.
      </div>
      <div id="dbg"></div>
    </header>
    <main><div id="notes" class="grid"></div></main>

    <div id="scalePanel" class="panel">
      <h3 id="scaleLabel">Scale</h3>
      <label>Tuning</label>
      <div class="g3" id="tunBtns"></div>
      <label>Reference A (Hz)</label>
      <div class="aRow">
        <button id="aDown">−1</button>
        <div id="aVal">440</div>
        <button id="aUp">+1</button>
      </div>
      <div class="g4">
        <button data-a="415">415</button><button data-a="432">432</button
        ><button data-a="440">440</button><button data-a="442">442</button>
      </div>
      <label>Root note</label>
      <div class="g4" id="rootBtns"></div>
    </div>

    <div id="settings" class="panel">
      <h3>Settings</h3>
      <label>Waveform</label>
      <div
        class="g3"
        id="waves"
        style="grid-template-columns: 1fr 1fr; margin-bottom: 6px"
      ></div>
      <label for="sens"
        >Cursor sensitivity: <span id="sensVal">0.50×</span></label
      >
      <input
        type="range"
        id="sens"
        min="0.25"
        max="2.5"
        step="0.05"
        value="0.5"
      />
      <label>Note layout</label>
      <div class="g3" style="grid-template-columns: 1fr 1fr">
        <button id="vGrid">Grid</button><button id="vList">List</button>
      </div>
      <label>Reverse head direction</label>
      <div class="g3" style="grid-template-columns: 1fr 1fr">
        <button id="flipX">Flip L/R</button><button id="flipY">Flip U/D</button>
      </div>
    </div>
    <div id="cursor"></div>

    <script src="https://cdn.jsdelivr.net/npm/webgazer@3.4.0/dist/webgazer.js"></script>
    <script>
      const NAMES = [
        "C",
        "C♯",
        "D",
        "D♯",
        "E",
        "F",
        "F♯",
        "G",
        "G♯",
        "A",
        "A♯",
        "B",
      ];
      const JI = [
        1,
        16 / 15,
        9 / 8,
        6 / 5,
        5 / 4,
        4 / 3,
        45 / 32,
        3 / 2,
        8 / 5,
        5 / 3,
        9 / 5,
        15 / 8,
      ];
      const TUN = {
        e12: { n: 12, name: "12-EDO" },
        ji: { n: 12, name: "Just" },
        e17: { n: 17, name: "17-EDO" },
        e19: { n: 19, name: "19-EDO" },
        e24: { n: 24, name: "24-EDO" },
        e31: { n: 31, name: "31-EDO" },
      };
      const ADSR = { a: 0.03, d: 0.12, s: 0.6, r: 0.3, peak: 0.22 };
      let wave = "sine",
        tun = "e12",
        refA = 440,
        rootIdx = 0,
        ctx = null,
        master = null;
      const voices = new Map();
      const $ = (id) => document.getElementById(id);
      const status = (t) => ($("status").textContent = t);

      /* Tuning: root is the note in the octave C4..B4 tuned from reference A4 (12-EDO anchor) */
      function rootFreq() {
        return refA * Math.pow(2, (rootIdx - 9) / 12);
      }
      function cents(k) {
        return tun === "ji" ? 1200 * Math.log2(JI[k]) : (k * 1200) / TUN[tun].n;
      }
      function freq(k) {
        return rootFreq() * Math.pow(2, cents(k) / 1200);
      }

      /* Audio */
      function ensureAudio() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain();
          master.gain.value = 0.9;
          master.connect(ctx.destination);
        }
        if (ctx.state !== "running") ctx.resume();
      }
      function startNote(i) {
        ensureAudio();
        const t = ctx.currentTime,
          o = ctx.createOscillator(),
          g = ctx.createGain();
        o.type = wave;
        o.frequency.value = freq(i);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(ADSR.peak, t + ADSR.a);
        g.gain.setTargetAtTime(ADSR.peak * ADSR.s, t + ADSR.a, ADSR.d / 3);
        o.connect(g);
        g.connect(master);
        o.start(t);
        voices.set(i, { o, g });
      }
      function stopNote(i) {
        const v = voices.get(i);
        if (!v) return;
        const t = ctx.currentTime;
        try {
          v.g.gain.cancelAndHoldAtTime(t);
        } catch (e) {
          v.g.gain.cancelScheduledValues(t);
          v.g.gain.setValueAtTime(v.g.gain.value, t);
        }
        v.g.gain.setTargetAtTime(0, t, ADSR.r / 3);
        v.o.stop(t + ADSR.r + 0.15);
        voices.delete(i);
      }
      function toggle(i) {
        voices.has(i) ? stopNote(i) : startNote(i);
        document
          .querySelector(`[data-note="${i}"]`)
          .classList.toggle("on", voices.has(i));
      }

      /* UI */
      const acts = new WeakMap();
      function bind(el, fn) {
        acts.set(el, fn);
        el.addEventListener("click", fn);
      }
      ["sine", "square", "triangle", "sawtooth"].forEach((w) => {
        const b = document.createElement("button");
        b.className = "wave";
        b.dataset.wave = w;
        b.textContent = w[0].toUpperCase() + w.slice(1);
        bind(b, () => {
          wave = w;
          document
            .querySelectorAll(".wave")
            .forEach((x) => x.classList.toggle("sel", x === b));
          voices.forEach((v) => (v.o.type = w));
        });
        $("waves").appendChild(b);
      });
      document.querySelector('[data-wave="sine"]').classList.add("sel");

      function setView(v) {
        $("notes").className = v;
        $("vGrid").classList.toggle("sel", v === "grid");
        $("vList").classList.toggle("sel", v === "list");
      }
      bind($("vGrid"), () => setView("grid"));
      bind($("vList"), () => setView("list"));

      function renderNotes() {
        const box = $("notes");
        box.innerHTML = "";
        for (let i = 0; i < TUN[tun].n; i++) {
          const c = cents(i),
            s = Math.round(c / 100),
            off = c - s * 100; // name = nearest 12-EDO note; small text shows the offset
          const dev =
            Math.abs(off) < 0.5
              ? ""
              : ` · ${off > 0 ? "+" : "−"}${Math.abs(Math.round(off))}¢`;
          const b = document.createElement("button");
          b.className = "note" + (voices.has(i) ? " on" : "");
          b.dataset.note = i;
          b.innerHTML = `<span>${NAMES[(rootIdx + s) % 12]}</span><small>${freq(i).toFixed(1)} Hz${dev}</small>`;
          bind(b, () => toggle(i));
          box.appendChild(b);
        }
      }
      function refresh() {
        // call after tuning, root or reference A changes
        const n = TUN[tun].n;
        [...voices.keys()].forEach((i) => {
          if (i >= n) stopNote(i);
          else
            voices
              .get(i)
              .o.frequency.setTargetAtTime(freq(i), ctx.currentTime, 0.02);
        });
        document
          .querySelectorAll("[data-tun]")
          .forEach((b) => b.classList.toggle("sel", b.dataset.tun === tun));
        document
          .querySelectorAll("[data-root]")
          .forEach((b) =>
            b.classList.toggle("sel", +b.dataset.root === rootIdx),
          );
        $("aVal").textContent = refA;
        $("scaleLabel").textContent =
          `${NAMES[rootIdx]} · ${TUN[tun].name} · A=${refA}`;
        renderNotes();
      }
      Object.entries(TUN).forEach(([k, v]) => {
        const b = document.createElement("button");
        b.dataset.tun = k;
        b.textContent = v.name;
        bind(b, () => {
          tun = k;
          refresh();
        });
        $("tunBtns").appendChild(b);
      });
      NAMES.forEach((n, i) => {
        const b = document.createElement("button");
        b.dataset.root = i;
        b.textContent = n;
        bind(b, () => {
          rootIdx = i;
          refresh();
        });
        $("rootBtns").appendChild(b);
      });
      const setA = (v) => {
        refA = Math.max(400, Math.min(480, v));
        refresh();
      };
      bind($("aDown"), () => setA(refA - 1));
      bind($("aUp"), () => setA(refA + 1));
      document
        .querySelectorAll("[data-a]")
        .forEach((b) => bind(b, () => setA(+b.dataset.a)));
      setView("grid");
      refresh();

      /* Head steering + mouth selection */
      const cur = $("cursor");
      let sens = 0.5; // cursor sensitivity multiplier (settings slider)
      let gx = innerWidth / 2,
        gy = innerHeight / 2,
        tracking = false,
        hover = null,
        lastT = 0,
        hist = [];
      let hx = 0,
        hy = 0,
        nhx = 0,
        nhy = 0,
        flipX = -1,
        flipY = 1; // smoothed head pose, neutral pose, direction flips
      let mb = null,
        openAt = null,
        fired = false,
        opening = false; // mouth baseline and state
      const HOLD_MS = 300,
        OPEN_DELTA = 0.12; // mouth must open this much past its closed baseline

      function targetAt(x, y) {
        const el = document.elementFromPoint(x, y);
        return el && el.closest("button");
      }
      function setHover(x, y) {
        const t = targetAt(x, y);
        if (t !== hover) {
          hover && hover.classList.remove("gazed");
          hover = t;
          hover && hover.classList.add("gazed");
        }
      }
      function axisSpeed(v) {
        const a = Math.abs(v),
          dz = 0.15;
        if (a < dz) return 0;
        const k = Math.min(1, (a - dz) / (1 - dz));
        return Math.sign(v) * (k * k * 800 + k * 80);
      }
      function step(now) {
        const dt = Math.min(0.05, (now - lastT) / 1000 || 0);
        lastT = now;
        if (openAt === null) {
          // cursor holds still once the mouth is open
          gx += axisSpeed(((hx - nhx) / 0.2) * flipX * sens) * dt;
          let vy = axisSpeed(((hy - nhy) / 0.18) * flipY * sens);
          if (vy < 0) vy *= 1.5; // tilting the head up is harder than down, so boost upward speed
          gy += vy * dt;
        }
        gx = Math.max(0, Math.min(innerWidth, gx));
        gy = Math.max(0, Math.min(innerHeight, gy));
        hist.push({ t: now, x: gx, y: gy });
        while (hist.length && now - hist[0].t > 1000) hist.shift();
        cur.style.transform = `translate(${gx}px,${gy}px)`;
        setHover(gx, gy);
      }
      function recenter() {
        status("Face the screen straight on and hold still…");
        setTimeout(() => {
          nhx = hx;
          nhy = hy;
          status(
            "Turn/tilt your head to steer. Open your mouth for 0.3 s to select. Use Flip if a direction is reversed.",
          );
        }, 2000);
      }
      function dist(a, b) {
        return Math.hypot(a[0] - b[0], a[1] - b[1]);
      }
      function loop() {
        if (!tracking) return;
        step(performance.now());
        try {
          const p = webgazer.getTracker().getPositions();
          if (!p || p.length <= 380) {
            $("dbg").textContent =
              "No face landmarks (" + (p ? p.length : 0) + ")";
          } else {
            const now = performance.now();
            // head pose: nose position relative to the eye line (chin is not used, since it moves with the mouth)
            const wd = dist(p[33], p[263]),
              mx = (p[33][0] + p[263][0]) / 2,
              my = (p[33][1] + p[263][1]) / 2;
            const yaw = (p[1][0] - mx) / wd,
              pit = (p[1][1] - my) / Math.max(1, my - p[10][1]);
            hx += (yaw - hx) * 0.2;
            hy += (pit - hy) * 0.2;
            // mouth opening: inner-lip gap divided by mouth width
            const mar = dist(p[13], p[14]) / dist(p[78], p[308]);
            if (mb === null) mb = mar;
            if (mar < mb + 0.08) mb += (mar - mb) * 0.05; // closed-mouth baseline adapts automatically
            const d = mar - mb;
            const open = d > OPEN_DELTA;
            $("dbg").textContent =
              `mouth: ${d.toFixed(2)} (selects above ${OPEN_DELTA})`;
            cur.classList.toggle("active", open);
            if (open && openAt === null) {
              openAt = now;
              fired = false;
            }
            if (open && !fired && now - openAt >= HOLD_MS) {
              fired = true;
              const ref = [...hist]
                .reverse()
                .find((h) => h.t <= openAt - 120) || { x: gx, y: gy }; // cursor position just before the mouth opened
              const t = targetAt(ref.x, ref.y);
              if (t && acts.get(t)) {
                acts.get(t)();
                if (navigator.vibrate) navigator.vibrate(20);
              }
            }
            if (!open) openAt = null;
          }
        } catch (err) {}
        requestAnimationFrame(loop);
      }

      bind($("track"), async () => {
        ensureAudio();
        if (tracking) {
          tracking = false;
          webgazer.pause();
          cur.style.display = "none";
          $("track").textContent = "Start tracking";
          $("track").classList.remove("sel");
          status("Head tracking off.");
          return;
        }
        if (typeof webgazer === "undefined") {
          status("Face-tracking library failed to load. Touch still works.");
          return;
        }
        status("Starting camera…");
        try {
          await webgazer.begin();
          [
            "showVideoPreview",
            "showFaceOverlay",
            "showFaceFeedbackBox",
            "showPredictionPoints",
          ].forEach((f) => {
            try {
              webgazer[f](false);
            } catch (e) {}
          });
          tracking = true;
          cur.style.display = "block";
          $("track").textContent = "Stop tracking";
          $("track").classList.add("sel");
          $("settings").classList.remove("open");
          recenter();
          loop();
        } catch (err) {
          status(
            "Couldn’t start the camera: " +
              (err && err.message ? err.message : err) +
              ". Touch still works.",
          );
        }
      });
      bind($("recenter"), () => {
        if (tracking) recenter();
      });
      bind($("flipX"), () => {
        flipX = -flipX;
      });
      bind($("flipY"), () => {
        flipY = -flipY;
      });

      /* Panels */
      const panels = [$("scalePanel"), $("settings")],
        toggles = [$("scaleBtn"), $("gear")];
      function togglePanel(p) {
        panels.forEach((x) => {
          if (x !== p) x.classList.remove("open");
        });
        p.classList.toggle("open");
      }
      bind($("scaleBtn"), () => togglePanel($("scalePanel")));
      bind($("gear"), () => togglePanel($("settings")));
      document.addEventListener("click", (e) => {
        if (
          !panels.some((p) => p.contains(e.target)) &&
          !toggles.some((t) => t.contains(e.target))
        )
          panels.forEach((p) => p.classList.remove("open"));
      });
      $("sens").addEventListener("input", (e) => {
        sens = parseFloat(e.target.value);
        $("sensVal").textContent = sens.toFixed(2) + "×";
      });
    </script>
  </body>
</html>
